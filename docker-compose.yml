services:
  control-plane:
    build: .
    ports:
      - "3100:3100"
    volumes:
      - lattice-data:/data
    environment:
      - PORT=3100
      - DB_PATH=/data/lattice.db
      - API_KEYS=${API_KEYS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lattice-data:
